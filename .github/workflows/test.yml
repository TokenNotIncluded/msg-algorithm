name: Algorithm tests
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.0'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked project
        run: uv sync --locked
      - name: Test editable installation
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Build source distribution and wheel
        run: uv build --no-sources
      - name: Test installed wheel without source imports
        run: |
          uv venv "$RUNNER_TEMP/msg-wheel"
          uv pip install --python "$RUNNER_TEMP/msg-wheel/bin/python" dist/*.whl
          "$RUNNER_TEMP/msg-wheel/bin/python" -I -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
