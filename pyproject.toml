[build-system]
requires = ["uv_build>=0.10.0,<0.14"]
build-backend = "uv_build"

[project]
name = "msg-algorithm"
version = "0.2.0"
description = "Transparent, bounded recommendations from explicit follows and interests"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/TokenNotIncluded/msg-algorithm"
Issues = "https://github.com/TokenNotIncluded/msg-algorithm/issues"

[tool.uv.build-backend]
source-include = [
    "__init__.py", "ranker.py", "README.zh-CN.md", ".python-version",
    "uv.lock", "tests/**", "benchmarks/**",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
